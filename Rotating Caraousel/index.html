<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Rotating Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel" id="carousel">
            <img src="v1.jpg" style="transform: rotateY(0deg) translateZ(200px);">
            <img src="v2.jpg" style="transform: rotateY(60deg) translateZ(200px);">
            <img src="v3.jpg" style="transform: rotateY(120deg) translateZ(200px);">
            <img src="v4.jpg" style="transform: rotateY(180deg) translateZ(200px);">
            <img src="v5.jpg" style="transform: rotateY(240deg) translateZ(200px);">
            <img src="v6.jpg" style="transform: rotateY(300deg) translateZ(200px);">
            <img src="v7.jpg" style="transform: rotateY(300deg) translateZ(200px);">
           
        </div>
    </div>
</body>
</html>
