<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signup-container">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                <div id="password-match-message" class="password-match">Passwords match!</div>
                <div id="password-mismatch-message" class="password-mismatch">Passwords do not match!</div>
            </div>
            <button type="submit" id="submit-button" disabled>Sign Up</button>
        </form>
    </div>
<script src="script.js"></script>
</body>
</html>
