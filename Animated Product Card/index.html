<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated PRoduct Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="imgbox">
                <img src="headephone.png" alt="">
            </div>
            <div class="contentbox">
                <h2>Headphone</h2>
                <div class="color">
                    <h3>color</h3>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="price">
                    <h3>price : </h3>
                    <span>$</span>
                    <span>2</span>
                    <span>0</span>
                    <span>0</span>
                </div>
                <a href="#">Buy now</a>
            </div>
        </div>
    </div>
    
</body>
</html>
